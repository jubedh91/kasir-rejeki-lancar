<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kasir Rejeki Lancar</title>
    <!-- Tailwind CSS untuk Desain Responsif HP & Tablet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- App Container -->
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        
        <!-- Header / Navbar -->
        <header class="bg-emerald-700 text-white shadow-md z-10 flex items-center justify-between px-4 py-3">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="text-white text-xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-lg font-bold tracking-wide">Kasir Rejeki Lancar</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="sync-status" class="text-xs bg-emerald-800 px-2 py-1 rounded text-emerald-200">Online Mode</span>
                <i class="fa-solid fa-user-shield text-lg"></i>
            </div>
        </header>

        <!-- Main Workspace (Responsive Split Layout for Tablet/MatePad & Phone) -->
        <div class="flex flex-1 overflow-hidden relative">
            
            <!-- Sidebar Drawer (Hidden by default on mobile, visible on desktop/tablet) -->
            <div id="sidebar" class="absolute md:relative inset-y-0 left-0 w-64 bg-white shadow-xl z-20 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
                <div class="p-4 bg-emerald-900 text-white font-bold text-center">
                    Menu Navigasi
                </div>
                <nav class="flex-1 overflow-y-auto p-2 space-y-1">
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-lg bg-emerald-50 text-emerald-700 font-medium">
                        <i class="fa-solid fa-cash-register w-5"></i><span>Kasir (POS)</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 text-gray-700">
                        <i class="fa-solid fa-boxes-stacked w-5"></i><span>Manajemen Barang</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 text-gray-700">
                        <i class="fa-solid fa-file-invoice-dollar w-5"></i><span>Laporan Transaksi</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 text-gray-700">
                        <i class="fa-solid fa-users w-5"></i><span>Pelanggan & Poin</span>
                    </a>
                    <a href="#" onclick="syncDataFromCloud()" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 text-blue-600">
                        <i class="fa-solid fa-cloud-arrow-down w-5"></i><span>Sinkronisasi Data</span>
                    </a>
                </nav>
            </div>

            <!-- Katalog Produk & Pencarian (Sisi Kiri / Utama) -->
            <div class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
                <!-- Search & Filter Bar -->
                <div class="p-3 bg-white border-b flex items-center space-x-2">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="search-box" oninput="filterProducts(this.value)" placeholder="Cari nama barang atau scan barcode..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>
                    <button onclick="loadInitialData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-sm">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>

                <!-- Product Grid List -->
                <div class="flex-1 overflow-y-auto p-3">
                    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                        <!-- Produk akan dirender otomatis via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Panel Keranjang Belanja (Sisi Kanan / Sticky Bottom di HP) -->
            <div class="w-full md:w-96 bg-white border-l flex flex-col h-full shadow-lg absolute md:relative inset-y-0 right-0 transform translate-x-full md:translate-x-0 transition-transform duration-300 z-10" id="cart-panel">
                <div class="p-3 bg-emerald-50 border-b flex justify-between items-center">
                    <h2 class="font-bold text-gray-700"><i class="fa-solid fa-cart-shopping mr-2"></i>Keranjang Belanja</h2>
                    <button onclick="toggleCartMobile()" class="md:hidden text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <!-- Items List in Cart -->
                <div id="cart-items" class="flex-1 overflow-y-auto p-3 divide-y">
                    <div class="text-center text-gray-400 py-8 text-sm">Keranjang masih kosong</div>
                </div>

                <!-- Cart Summary & Checkout Actions -->
                <div class="p-4 bg-gray-50 border-t space-y-2">
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>Total Item:</span>
                        <span id="cart-count">0 Pcs</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold text-gray-800">
                        <span>Total Bayar:</span>
                        <span id="cart-total" class="text-emerald-600">Rp 0</span>
                    </div>
                    <button onclick="processCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition duration-200">
                        BAYAR SEKARANG
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Floating Cart Button for Mobile View -->
    <div class="md:hidden fixed bottom-4 right-4 z-30">
        <button onclick="toggleCartMobile()" class="bg-emerald-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-xl relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="mobile-cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
    </div>

    <!-- Firebase SDK (Modular CDN v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase dari Project Anda[cite: 507]
        const firebaseConfig = {
            apiKey: "AIzaSyAYlaNmY5xdAO72-GceG8TMODAXrvKoQSo",
            authDomain: "pos-rejeki-lancar.firebaseapp.com",
            projectId: "pos-rejeki-lancar",
            storageBucket: "pos-rejeki-lancar.firebasestorage.app",
            messagingSenderId: "647198272530",
            appId: "1:647198272530:web:60730b6c34d46449bafccb",
            measurementId: "G-P7YN1ZJQEJ"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Aplikasi
        let products = [];
        let cart = [];

        // Fungsi Load Data dengan Local Caching (Hemat Kuota Read Firebase)
        window.loadInitialData = async function() {
            const cachedProducts = localStorage.getItem('pos_products_cache');
            
            if (cachedProducts) {
                products = JSON.parse(cachedProducts);
                renderProducts(products);
                document.getElementById('sync-status').innerText = "Cache Lokal Aktif";
            }

            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                const cloudProducts = [];
                querySnapshot.forEach((doc) => {
                    cloudProducts.push({ id: doc.id, ...doc.data() });
                });

                if (cloudProducts.length > 0) {
                    products = cloudProducts;
                    localStorage.setItem('pos_products_cache', JSON.stringify(products));
                    renderProducts(products);
                    document.getElementById('sync-status').innerText = "Sinkron Cloud Sukses";
                }
            } catch (error) {
                console.error("Gagal sinkron dari cloud:", error);
                document.getElementById('sync-status').innerText = "Offline Mode (Cache)";
                if (!cachedProducts) {
                    // Data Mock Dummy jika database kosong/offline
                    products = [
                        { id: '1', name: 'Minyak Goreng 1L', price: 18000, stock: 45 },
                        { id: '2', name: 'Gula Pasir 1Kg', price: 15500, stock: 30 },
                        { id: '3', name: 'Beras Premium 5Kg', price: 68000, stock: 15 },
                        { id: '4', name: 'Kopi Bubuk Hitam', price: 7500, stock: 100 }
                    ];
                    renderProducts(products);
                }
            }
        };

        // Render Produk ke Grid
        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            list.forEach(p => {
                grid.innerHTML += `
                    <div onclick="addToCart('${p.id}')" class="bg-white p-3 rounded-xl shadow-sm border hover:border-emerald-500 cursor-pointer flex flex-col justify-between transition">
                        <div>
                            <h3 class="font-semibold text-sm text-gray-800 line-clamp-2">${p.name}</h3>
                            <p class="text-xs text-gray-500 mt-1">Stok: ${p.stock}</p>
                        </div>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-emerald-600 font-bold text-sm">Rp ${p.price.toLocaleString('id-ID')}</span>
                            <span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-1 rounded"><i class="fa-solid fa-plus"></i></span>
                        </div>
                    </div>
                `;
            });
        }

        // Filter Pencarian
        window.filterProducts = function(keyword) {
            const filtered = products.filter(p => p.name.toLowerCase().includes(keyword.toLowerCase()));
            renderProducts(filtered);
        };

        // Tambah ke Keranjang
        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            if (!product || product.stock <= 0) return alert('Stok habis!');

            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty < product.stock) {
                    existing.qty++;
                } else {
                    alert('Stok maksimal tercapai');
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        };

        // Render Keranjang
        function renderCart() {
            const container = document.getElementById('cart-items');
            const cartCountBadge = document.getElementById('mobile-cart-badge');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm">Keranjang masih kosong</div>`;
                document.getElementById('cart-count').innerText = `0 Pcs`;
                document.getElementById('cart-total').innerText = `Rp 0`;
                cartCountBadge.innerText = `0`;
                return;
            }

            let totalItems = 0;
            let totalPrice = 0;

            cart.forEach((item, index) => {
                totalItems += item.qty;
                totalPrice += item.price * item.qty;
                container.innerHTML += `
                    <div class="py-2 flex justify-between items-center text-sm">
                        <div class="flex-1">
                            <p class="font-medium text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="updateQty(${index}, -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-600 font-bold">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="w-6 h-6 bg-emerald-100 rounded text-emerald-700 font-bold">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-count').innerText = `${totalItems} Pcs`;
            document.getElementById('cart-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            cartCountBadge.innerText = `${totalItems}`;
        }

        window.updateQty = function(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        };

        // Proses Checkout & Integrasi Cetak RawBT
        window.processCheckout = async function() {
            if (cart.length === 0) return alert('Keranjang masih kosong!');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const transactionData = {
                items: cart,
                totalAmount: total,
                createdAt: serverTimestamp()
            };

            try {
                // Simpan transaksi ke Firestore
                await addDoc(collection(db, "transactions"), transactionData);
                alert('Transaksi Berhasil Disimpan!');

                // Format Cetak Struk ESC/POS untuk RawBT Printer Intent
                let printText = "TOKO REJEKI LANCAR\n==========================\n";
                cart.forEach(i => {
                    printText += `${i.name}\n  ${i.qty} x ${i.price} = ${i.qty * i.price}\n`;
                });
                printText += `==========================\nTOTAL: Rp ${total.toLocaleString('id-ID')}\nTerima Kasih!\n\n\n`;

                // Panggil Intent RawBT
                const encoded = encodeURIComponent(printText);
                window.location.href = `rawbt:base64,${btoa(printText)}`;

                // Reset Keranjang
                cart = [];
                renderCart();
            } catch (e) {
                console.error("Gagal menyimpan transaksi:", e);
                alert('Gagal memproses transaksi ke database.');
            }
        };

        // UI toggles
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        };

        window.toggleCartMobile = function() {
            const cartPanel = document.getElementById('cart-panel');
            cartPanel.classList.toggle('translate-x-full');
        };

        // Jalankan saat pertama buka
        loadInitialData();
    </script>
</body>
</html>
