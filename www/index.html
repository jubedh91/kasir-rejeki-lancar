<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Rejeki Lancar</title>
    <!-- Menggunakan Tailwind CSS via CDN untuk tampilan desain yang rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navigasi / Header -->
    <nav class="bg-blue-700 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">POS Rejeki Lancar</h1>
            <span class="text-sm bg-green-500 px-3 py-1 rounded-full font-semibold">Sistem Aktif</span>
        </div>
    </nav>

    <!-- Kontainer Utama Kasir -->
    <div class="container mx-auto p-4 flex flex-col md:flex-row gap-6 mt-4">
        
        <!-- Bagian Kiri: Daftar Produk -->
        <div class="w-full md:w-2/3 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Daftar Produk</h2>
            
            <!-- Tempat Produk Ditampilkan -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="daftar-produk">
                <!-- Contoh Produk Dummy (Nanti bisa diganti dengan data dari Firestore) -->
                <div class="border p-4 rounded-lg text-center hover:shadow-lg hover:border-blue-500 transition cursor-pointer" onclick="tambahKeKeranjang('Beras 5kg', 65000)">
                    <h3 class="font-bold text-gray-700">Beras 5kg</h3>
                    <p class="text-blue-600 font-semibold">Rp 65.000</p>
                </div>
                <div class="border p-4 rounded-lg text-center hover:shadow-lg hover:border-blue-500 transition cursor-pointer" onclick="tambahKeKeranjang('Minyak Goreng 2L', 35000)">
                    <h3 class="font-bold text-gray-700">Minyak Goreng 2L</h3>
                    <p class="text-blue-600 font-semibold">Rp 35.000</p>
                </div>
                <div class="border p-4 rounded-lg text-center hover:shadow-lg hover:border-blue-500 transition cursor-pointer" onclick="tambahKeKeranjang('Telur 1kg', 28000)">
                    <h3 class="font-bold text-gray-700">Telur 1kg</h3>
                    <p class="text-blue-600 font-semibold">Rp 28.000</p>
                </div>
            </div>
        </div>

        <!-- Bagian Kanan: Keranjang Belanja -->
        <div class="w-full md:w-1/3 bg-white p-6 rounded-lg shadow-md flex flex-col h-fit">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Keranjang Belanja</h2>
            
            <!-- Daftar Item di Keranjang -->
            <div id="keranjang-items" class="flex-grow mb-4 min-h-[200px]">
                <p class="text-gray-400 text-center mt-10">Keranjang masih kosong</p>
            </div>

            <!-- Total dan Tombol Bayar -->
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-xl mb-4">
                    <span>Total:</span>
                    <span id="total-harga" class="text-blue-700">Rp 0</span>
                </div>
                <button id="btn-bayar" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                    Bayar Sekarang
                </button>
            </div>
        </div>

    </div>

    <!-- ========================================= -->
    <!-- KODE FIREBASE & LOGIKA JAVASCRIPT KASIR   -->
    <!-- ========================================= -->
    <script type="module">
        // 1. Import Firebase Core & Analytics (Sesuai kode Anda)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
        
        // 2. Import Firestore (Database). Saya tambahkan ini karena kasir butuh database
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        // 3. Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAYlaNmY5xdAO72-GceG8TMODAXrvKoQSo",
            authDomain: "pos-rejeki-lancar.firebaseapp.com",
            projectId: "pos-rejeki-lancar",
            storageBucket: "pos-rejeki-lancar.firebasestorage.app",
            messagingSenderId: "647198272530",
            appId: "1:647198272530:web:60730b6c34d46449bafccb",
            measurementId: "G-P7YN1ZJQEJ"
        };

        // 4. Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        console.log("Firebase berhasil terkoneksi dengan project:", firebaseConfig.projectId);

        // =========================================
        // LOGIKA INTERAKTIF KASIR
        // =========================================
        
        // Simpan data keranjang di memori sementara
        window.keranjang = [];
        window.totalHarga = 0;

        // Fungsi untuk menambah item ke keranjang (Bisa dipanggil dari HTML)
        window.tambahKeKeranjang = function(nama, harga) {
            window.keranjang.push({ nama: nama, harga: harga });
            updateTampilanKeranjang();
        };

        // Fungsi untuk memperbarui layar keranjang
        function updateTampilanKeranjang() {
            const wadahKeranjang = document.getElementById('keranjang-items');
            const teksTotal = document.getElementById('total-harga');
            
            wadahKeranjang.innerHTML = '';
            window.totalHarga = 0;

            if (window.keranjang.length === 0) {
                wadahKeranjang.innerHTML = '<p class="text-gray-400 text-center mt-10">Keranjang masih kosong</p>';
            } else {
                window.keranjang.forEach((item) => {
                    window.totalHarga += item.harga;
                    wadahKeranjang.innerHTML += `
                        <div class="flex justify-between items-center mb-3 text-sm border-b pb-2">
                            <span class="font-medium text-gray-700">${item.nama}</span>
                            <span class="text-gray-600">Rp ${item.harga.toLocaleString('id-ID')}</span>
                        </div>
                    `;
                });
            }
            
            teksTotal.innerText = 'Rp ' + window.totalHarga.toLocaleString('id-ID');
        }

        // Tombol Bayar Diklik
        document.getElementById('btn-bayar').addEventListener('click', () => {
            if (window.keranjang.length === 0) {
                alert('Keranjang masih kosong! Silakan klik produk terlebih dahulu.');
                return;
            }

            // Simulasi proses bayar (Nantinya di sini kita masukkan kode simpan ke Firestore)
            alert('Pembayaran sebesar Rp ' + window.totalHarga.toLocaleString('id-ID') + ' BERHASIL.\n\n(Nantinya data struk ini akan otomatis tersimpan ke Database Firebase)');
            
            // Kosongkan keranjang setelah selesai bayar
            window.keranjang = [];
            updateTampilanKeranjang();
        });
