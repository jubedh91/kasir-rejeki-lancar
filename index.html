<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Rejeki Lancar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <nav class="bg-blue-700 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">POS Rejeki Lancar</h1>
            <span id="status-db" class="text-xs md:text-sm bg-yellow-500 text-white px-3 py-1 rounded-full font-semibold">Menghubungkan...</span>
        </div>
    </nav>

    <div class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Kolom Kiri: Form & Daftar Produk -->
        <div class="md:col-span-2 space-y-6">

            <!-- Form Tambah Produk -->
            <div class="bg-white p-5 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">➕ Tambah Produk Toko</h2>
                <form id="form-produk" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="nama-produk" placeholder="Nama Barang (ex: Minyak Goreng)" required class="border p-2 rounded w-full sm:w-1/2 text-sm">
                    <input type="number" id="harga-produk" placeholder="Harga (ex: 15000)" required class="border p-2 rounded w-full sm:w-1/4 text-sm">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700 text-sm">Simpan Produk</button>
                </form>
            </div>

            <!-- Daftar Produk dari Firebase -->
            <div class="bg-white p-5 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">📦 Daftar Produk (Klik untuk pilih)</h2>
                <div id="daftar-produk" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <p class="text-gray-400 col-span-full text-center py-4">Memuat produk dari database...</p>
                </div>
            </div>

        </div>

        <!-- Kolom Kanan: Keranjang Belanja -->
        <div class="bg-white p-5 rounded-lg shadow flex flex-col justify-between h-fit">
            <div>
                <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">🛒 Keranjang Belanja</h2>
                <div id="keranjang-items" class="space-y-2 mb-4 min-h-[150px]">
                    <p class="text-gray-400 text-center py-6 text-sm">Keranjang masih kosong</p>
                </div>
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="total-harga" class="text-blue-700">Rp 0</span>
                </div>
                <button id="btn-bayar" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                    Bayar Sekarang
                </button>
            </div>
        </div>

    </div>

    <!-- Script Firebase & Sistem Kasir -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYlaNmY5xdAO72-GceG8TMODAXrvKoQSo",
            authDomain: "pos-rejeki-lancar.firebaseapp.com",
            projectId: "pos-rejeki-lancar",
            storageBucket: "pos-rejeki-lancar.firebasestorage.app",
            messagingSenderId: "647198272530",
            appId: "1:647198272530:web:60730b6c34d46449bafccb",
            measurementId: "G-P7YN1ZJQEJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Update Indikator Status
        document.getElementById('status-db').innerText = "Firebase Terhubung";
        document.getElementById('status-db').className = "text-xs md:text-sm bg-green-500 text-white px-3 py-1 rounded-full font-semibold";

        let keranjang = [];
        let totalHarga = 0;

        // 1. Tambah Produk ke Firestore Database
        const formProduk = document.getElementById('form-produk');
        formProduk.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama-produk').value;
            const harga = Number(document.getElementById('harga-produk').value);

            try {
                await addDoc(collection(db, "produk"), { nama, harga, createdAt: serverTimestamp() });
                formProduk.reset();
            } catch (err) {
                alert("Gagal menyimpan produk: " + err.message + "\nPastikan Firestore Database sudah diaktifkan di Firebase Console!");
            }
        });

        // 2. Baca Daftar Produk secara Realtime
        onSnapshot(collection(db, "produk"), (snapshot) => {
            const wadahProduk = document.getElementById('daftar-produk');
            wadahProduk.innerHTML = '';

            if (snapshot.empty) {
                wadahProduk.innerHTML = '<p class="text-gray-400 col-span-full text-center py-4">Belum ada produk. Tambahkan produk pada form di atas!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = "border p-3 rounded-lg text-center cursor-pointer hover:border-blue-500 hover:shadow transition bg-gray-50";
                card.innerHTML = `
                    <h3 class="font-semibold text-gray-800 text-sm">${data.nama}</h3>
                    <p class="text-blue-600 font-bold text-sm">Rp ${data.harga.toLocaleString('id-ID')}</p>
                `;
                card.onclick = () => tambahKeKeranjang(data.nama, data.harga);
                wadahProduk.appendChild(card);
            });
        });

        // 3. Logika Keranjang Belanja
        function tambahKeKeranjang(nama, harga) {
            keranjang.push({ nama, harga });
            updateKeranjang();
        }

        function updateKeranjang() {
            const wadahKeranjang = document.getElementById('keranjang-items');
            const teksTotal = document.getElementById('total-harga');
            wadahKeranjang.innerHTML = '';
            totalHarga = 0;

            if (keranjang.length === 0) {
                wadahKeranjang.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">Keranjang masih kosong</p>';
            } else {
                keranjang.forEach((item, index) => {
                    totalHarga += item.harga;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "flex justify-between items-center text-sm border-b pb-1";
                    itemDiv.innerHTML = `
                        <span>${item.nama}</span>
                        <div class="flex items-center gap-2">
                            <span class="font-semibold">Rp ${item.harga.toLocaleString('id-ID')}</span>
                            <button class="text-red-500 font-bold px-1" onclick="hapusKeranjang(${index})">✕</button>
                        </div>
                    `;
                    wadahKeranjang.appendChild(itemDiv);
                });
            }
            teksTotal.innerText = 'Rp ' + totalHarga.toLocaleString('id-ID');
        }

        window.hapusKeranjang = function(index) {
            keranjang.splice(index, 1);
            updateKeranjang();
        };

        // 4. Simpan Transaksi Penjualan ke Firestore
        document.getElementById('btn-bayar').addEventListener('click', async () => {
            if (keranjang.length === 0) {
                alert('Keranjang belanja masih kosong!');
                return;
            }

            try {
                await addDoc(collection(db, "transaksi"), {
                    items: keranjang,
                    total: totalHarga,
                    waktu: serverTimestamp()
                });
                alert('Pembayaran Berhasil! Data transaksi tersimpan di database.');
                keranjang = [];
                updateKeranjang();
            } catch (err) {
                alert('Gagal memproses transaksi: ' + err.message);
            }
        });
    </script>
</body>
</html>
